<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：刘海屏下让 env(safe-area-inset-*) 生效。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Danmo Novel</title>
    <!--
      不链 Google Fonts：移动端是离线应用，联网取字体既会闪回退字形，也会让
      App Store 审核认为应用依赖外部资源。字体走系统（见 src/mobile/styles.css）。
    -->
  </head>
  <body>
    <div id="app">
      <div class="core-loading">
        <div class="core-loading-mark">N</div>
        <strong>Danmo Novel</strong>
        <span>正在准备本地工作区…</span>
      </div>
    </div>
    <script type="module" src="/src/main.mobile.ts"></script>
  </body>
</html>
