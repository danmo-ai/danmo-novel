name: DanmoNovel
options:
  bundleIdPrefix: com.danmo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../out/mobile"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
packages:
  DanmoNovelCore:
    path: .
targets:
  DanmoNovel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: DanmoNovelCore
        product: DanmoNovelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmo.novel
        PRODUCT_NAME: DanmoNovel
        PRODUCT_MODULE_NAME: DanmoNovelApp
        # Explicit plists: NSUbiquitousContainers is a nested dictionary, which
        # GENERATE_INFOPLIST_FILE cannot express through INFOPLIST_KEY_*.
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DanmoNovel.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "${RELEASE_VERSION}"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
      testTargets:
        - DanmoNovelTests
        - DanmoNovelUITests
  DanmoNovelUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: DanmoNovel
  DanmoNovelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: DanmoNovel
