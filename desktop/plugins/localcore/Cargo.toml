[package]
name = "tauri-plugin-localcore"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-localcore"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

# Keep the same links-based ACL handoff as the official Tauri plugins.
