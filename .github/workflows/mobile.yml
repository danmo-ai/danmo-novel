name: Mobile builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  REPO_DIR: app

jobs:
  ios:
    name: iOS local core and app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      # gomobile itself is installed by build_go_mobile.sh at the version go.mod
      # pins, so only the Xcode-side helpers are needed here.
      - run: brew install xcodegen cocoapods libimobiledevice
      - run: ./scripts/pack_mobile.sh ios
        working-directory: ${{ env.REPO_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-ios
          # 没有签名密钥时产出的是模拟器包，所以两种产物都收：有 .ipa 收 .ipa，
          # 没有就收 .app（可直接 simctl install 验证）。
          path: |
            ${{ env.REPO_DIR }}/out/mobile/*.xcframework/**
            ${{ env.REPO_DIR }}/desktop/src-tauri/gen/apple/build/**/*.ipa
            ${{ env.REPO_DIR }}/desktop/src-tauri/gen/apple/build/**/*.app/**
          if-no-files-found: ignore

  android:
    name: Android local core and app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # v3 tried to install the retired `tools` package and aborted; v4 knows
      # cmdline-tools no longer ships it and accepts the SDK licences itself.
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'ndk;29.0.14206865' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - run: ./scripts/pack_mobile.sh android
        working-directory: ${{ env.REPO_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-android
          path: |
            ${{ env.REPO_DIR }}/out/mobile/*.aar
            ${{ env.REPO_DIR }}/desktop/src-tauri/gen/android/app/build/outputs/**/*.apk
            ${{ env.REPO_DIR }}/desktop/src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: ignore
