name: Mobile builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  REPO_DIR: app

jobs:
  ios:
    name: iOS local core and app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ${{ env.REPO_DIR }} }
      - uses: actions/checkout@v4
        with: { repository: danmo-ai/dq-ui, path: dq-ui }
      - uses: actions/setup-go@v5
        with: { go-version: ${{ env.GO_VERSION }}, cache-dependency-path: ${{ env.REPO_DIR }}/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios }
      - run: npm install --no-audit --no-fund
        working-directory: dq-ui
      - run: npm run build
        working-directory: dq-ui/packages/tokens
      - run: npm run build
        working-directory: dq-ui/packages/ui
      - run: npm run build
        working-directory: dq-ui/packages/shell
      - run: |
          brew install xcodegen cocoapods libimobiledevice
          go install golang.org/x/mobile/cmd/gomobile@latest
          ./scripts/build_go_mobile.sh ios
        working-directory: ${{ env.REPO_DIR }}
      - run: npm install && npm run tauri ios build -- --ci --no-sign --config src-tauri/tauri.ios.conf.json
        working-directory: ${{ env.REPO_DIR }}/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-ios
          path: |
            ${{ env.REPO_DIR }}/out/mobile/*.xcframework/**
            ${{ env.REPO_DIR }}/desktop/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: ignore

  android:
    name: Android local core and app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ${{ env.REPO_DIR }} }
      - uses: actions/checkout@v4
        with: { repository: danmo-ai/dq-ui, path: dq-ui }
      - uses: actions/setup-go@v5
        with: { go-version: ${{ env.GO_VERSION }}, cache-dependency-path: ${{ env.REPO_DIR }}/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'ndk;29.0.14206865' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android }
      - run: npm install --no-audit --no-fund
        working-directory: dq-ui
      - run: npm run build
        working-directory: dq-ui/packages/tokens
      - run: npm run build
        working-directory: dq-ui/packages/ui
      - run: npm run build
        working-directory: dq-ui/packages/shell
      - run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          ./scripts/build_go_mobile.sh android
        working-directory: ${{ env.REPO_DIR }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - run: npm install && npm run tauri android build -- --ci --config src-tauri/tauri.android.conf.json
        working-directory: ${{ env.REPO_DIR }}/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-android
          path: |
            ${{ env.REPO_DIR }}/out/mobile/*.aar
            ${{ env.REPO_DIR }}/desktop/src-tauri/gen/android/app/build/outputs/**/*.apk
            ${{ env.REPO_DIR }}/desktop/src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: ignore
