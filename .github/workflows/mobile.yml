name: Native mobile builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  REPO_DIR: app

jobs:
  ios:
    name: SwiftUI app and Go core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum
      - run: brew install xcodegen
      - name: Import iOS signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/ci_import_ios_signing.sh
        working-directory: ${{ env.REPO_DIR }}
      - name: Build native SwiftUI app
        working-directory: ${{ env.REPO_DIR }}
        run: ./scripts/pack_mobile.sh ios
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}
      - uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-native-ios
          path: ${{ env.REPO_DIR }}/out/mobile/native/*
          if-no-files-found: ignore

  android:
    name: Compose app and Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'ndk;29.0.14206865' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native Compose app
        working-directory: ${{ env.REPO_DIR }}
        run: ./scripts/pack_mobile.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-native-android
          path: |
            ${{ env.REPO_DIR }}/native-android/app/build/outputs/apk/**/*.apk
            ${{ env.REPO_DIR }}/native-android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
