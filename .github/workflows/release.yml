name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (e.g. 0.1.0)
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  REPO_DIR: app
  APP_NAME: danmo-novel

jobs:
  macos-desktop:
    name: macOS desktop
    runs-on: macos-latest
    # 正常 10 分钟；Apple 公证队列偶尔要 30 分钟以上（实测一次 33 分钟），
    # 给足余量但别用默认的 6 小时——真卡住时占着 runner 白烧配额。
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}

      - name: Checkout dq-ui
        uses: actions/checkout@v4
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install & build dq-ui workspace
        working-directory: dq-ui
        run: npm install --no-audit --no-fund
      - name: Build dq-ui packages
        run: npm run build
        working-directory: dq-ui/packages/tokens
      - run: npm run build
        working-directory: dq-ui/packages/ui
      - run: npm run build
        working-directory: dq-ui/packages/shell

      - name: Set release version
        working-directory: ${{ env.REPO_DIR }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Inject version into config files
        working-directory: ${{ env.REPO_DIR }}
        run: |
          V="$RELEASE_VERSION"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" desktop/src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" frontend/package.json
          rm -f desktop/src-tauri/tauri.conf.json.bak desktop/src-tauri/Cargo.toml.bak frontend/package.json.bak
          echo "Version set to $V"

      - name: Prepare Tauri signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          ${{ env.REPO_DIR }}/scripts/ci_prepare_tauri_signing_key.sh

      # 导入 Apple 证书到临时 keychain，并把 APPLE_* 传给后续步骤。
      # 没设 APPLE_CERTIFICATE 时脚本直接跳过，产物走 ad-hoc 签名（可打包，不可分发）。
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          ${{ env.REPO_DIR }}/scripts/ci_import_apple_cert.sh

      - name: Build macOS desktop
        working-directory: ${{ env.REPO_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/*.sh
          make pack-macos-desktop RELEASE_VERSION="$RELEASE_VERSION"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-desktop-macos
          path: |
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.dmg
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.app.tar.gz
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.app.tar.gz.sig
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}

      - name: Checkout dq-ui
        uses: actions/checkout@v4
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install & build dq-ui workspace
        working-directory: dq-ui
        run: npm install --no-audit --no-fund
      - name: Build dq-ui packages
        run: npm run build
        working-directory: dq-ui/packages/tokens
      - run: npm run build
        working-directory: dq-ui/packages/ui
      - run: npm run build
        working-directory: dq-ui/packages/shell

      - name: Set release version
        working-directory: ${{ env.REPO_DIR }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Inject version into config files
        working-directory: ${{ env.REPO_DIR }}
        run: |
          V="$RELEASE_VERSION"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" desktop/src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" frontend/package.json
          rm -f desktop/src-tauri/tauri.conf.json.bak desktop/src-tauri/Cargo.toml.bak frontend/package.json.bak
          echo "Version set to $V"

      - name: Prepare Tauri signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          ${{ env.REPO_DIR }}/scripts/ci_prepare_tauri_signing_key.sh

      - name: Build Linux desktop
        working-directory: ${{ env.REPO_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/*.sh
          make pack-linux-desktop RELEASE_VERSION="$RELEASE_VERSION"

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-desktop-linux
          path: |
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.AppImage
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.AppImage.sig
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.AppImage.tar.gz
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.AppImage.tar.gz.sig
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.deb
          if-no-files-found: error

  windows-desktop:
    name: Windows desktop
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}

      - name: Checkout dq-ui
        uses: actions/checkout@v4
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Make
        run: choco install make -y --no-progress
        shell: pwsh

      - name: Install & build dq-ui workspace
        working-directory: dq-ui
        run: npm install --no-audit --no-fund
      - name: Build dq-ui packages
        run: npm run build
        working-directory: dq-ui/packages/tokens
      - run: npm run build
        working-directory: dq-ui/packages/ui
      - run: npm run build
        working-directory: dq-ui/packages/shell

      - name: Verify dq-ui checkout
        run: test -f dq-ui/packages/ui/package.json
        shell: bash

      - name: Set release version
        working-directory: ${{ env.REPO_DIR }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Inject version into config files
        working-directory: ${{ env.REPO_DIR }}
        run: |
          V="$RELEASE_VERSION"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" desktop/src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" frontend/package.json
          rm -f desktop/src-tauri/tauri.conf.json.bak desktop/src-tauri/Cargo.toml.bak frontend/package.json.bak
          echo "Version set to $V"

      - name: Prepare Tauri signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          ${{ env.REPO_DIR }}/scripts/ci_prepare_tauri_signing_key.sh

      - name: Build Windows desktop
        working-directory: ${{ env.REPO_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/*.sh
          make pack-windows-desktop RELEASE_VERSION="$RELEASE_VERSION"

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: danmo-novel-desktop-windows
          path: |
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.exe
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.nsis.zip
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.nsis.zip.sig
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.sig
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos-desktop, linux-desktop, windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}
          fetch-depth: 0

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: danmo-novel-desktop-macos
          path: release-assets/macos

      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: danmo-novel-desktop-linux
          path: release-assets/linux

      - name: Download Windows desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: danmo-novel-desktop-windows
          path: release-assets/windows

      - name: Set release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate GitHub latest.json
        id: updater_manifest
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          if find release-assets \( -name '*.app.tar.gz' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.nsis.zip' \) | grep -q .; then
            ${{ env.REPO_DIR }}/scripts/generate_updater_latest_json.sh \
              --version "$RELEASE_VERSION" \
              --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
              --asset-dir release-assets \
              --out release-assets/latest.json \
              --notes "Danmo Novel $RELEASE_VERSION"
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "No updater artifacts found — skip latest.json (set TAURI_SIGNING_PRIVATE_KEY secret)"
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/**/*.dmg
            release-assets/macos/**/*.app.tar.gz
            release-assets/macos/**/*.app.tar.gz.sig
            release-assets/linux/**/*.AppImage
            release-assets/linux/**/*.AppImage.sig
            release-assets/linux/**/*.AppImage.tar.gz
            release-assets/linux/**/*.AppImage.tar.gz.sig
            release-assets/linux/**/*.deb
            release-assets/windows/**/*.exe
            release-assets/windows/**/*.nsis.zip
            release-assets/windows/**/*.sig
            release-assets/latest.json
          fail_on_unmatched_files: false
